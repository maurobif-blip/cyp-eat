<!doctype html>
<html lang="en">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --blue:#0B5FA5; --ink:#14213D; --muted:#4A5568; --ground:#F4F6FA; --card:#FFFFFF; --line:#D5DBE6; --edge:#7A869A;
  --em-bg:#FFE9D1; --em-ink:#6B2C00; --em:#B85300; --ok-bg:#DDF2DA; --ok-ink:#14600A; --wait-bg:#E4EBF7; --wait-ink:#1D3F7A;
  --warn-bg:#FFF4C2; --warn-ink:#5C4400; --off-bg:#ECECEC; --off-ink:#333333;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
h1{margin:0;font-size:24px} h2{margin:4px 0 0;font-size:18px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--ground)}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top);z-index:5}
.top .who{font-size:14px;font-weight:700;color:var(--muted);text-align:right;background:none;border:0;padding:4px 0;min-height:44px}
.net{font-size:14px;font-weight:700;padding:6px 16px;background:var(--warn-bg);color:var(--warn-ink)}
.net.ok{background:var(--wait-bg);color:var(--wait-ink)}
main{flex:1 1 auto;padding:16px calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{min-height:48px;padding:0 14px;border-radius:8px;border:2px solid var(--edge);background:var(--card);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;color:var(--ink)}
.btn.pri,.btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.big{min-height:56px;font-size:18px}
.btn.sq{width:48px;padding:0;font-size:24px;flex-shrink:0}
.btn.link{border:0;background:none;color:var(--blue);min-height:44px;padding:0 4px;justify-content:flex-start}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:grid;gap:6px}
.pill{padding:4px 10px;border-radius:999px;font-size:14px;font-weight:700;background:var(--wait-bg);color:var(--wait-ink);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn-ink)} .pill.off{background:var(--off-bg);color:var(--off-ink)} .pill.em{background:var(--em-bg);color:var(--em-ink)}
.in{width:100%;min-height:48px;padding:0 12px;border:2px solid var(--edge);border-radius:8px;background:#fff}
.in:disabled{background:var(--off-bg);border-color:var(--line)}
textarea.in{min-height:110px;padding:10px 12px}
.lab{font-weight:700}
.sec{font-size:14px;font-weight:700;color:var(--blue)}
.m{color:var(--muted)} .s{font-size:14px} .b{font-weight:700} .num{font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 0}
.row:first-child{border-top:0}
.nc{min-height:40px;padding:0 10px;border-radius:8px;border:2px solid var(--edge);background:#fff;font-size:14px;font-weight:700}
.nc.on{background:var(--em-bg);border-color:var(--em);color:var(--em-ink)}
.step{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:64px;width:100%;text-align:left}
.dot{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:13px}
.dot.ok{background:var(--ok-bg);color:var(--ok-ink)} .dot.em{background:var(--blue);color:#fff} .dot.off{background:var(--off-bg);color:var(--off-ink)}
.box{border-radius:8px;padding:12px;font-weight:700;border:2px solid}
.box.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-ink)}
.box.em{background:var(--em-bg);color:var(--em-ink);border-color:var(--em)}
.box.info{background:var(--wait-bg);color:var(--wait-ink);border-color:var(--blue)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.bottom .in2{display:flex;width:100%;max-width:560px}
.navi{flex:1 1 0;min-height:62px;border:0;border-top:4px solid #fff;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted)}
.navi.on{color:var(--blue);border-top-color:var(--blue)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tap{width:250px;height:250px;border-radius:999px;border:0;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 0 #08467A;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tap:active{transform:translateY(4px);box-shadow:0 2px 0 #08467A}
.daybar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px}
.daybar.today{border-color:var(--ok-ink)} .daybar.past{border-color:var(--em)}
.grid4{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;font-size:15px}
.grid4 span{padding:7px 0;border-top:1px solid var(--line)} .grid4 .h{font-size:13px;font-weight:700;color:var(--muted);border-top:0}
.grid4 .r{text-align:right}
.bar{height:14px;border-radius:4px;background:var(--wait-bg);overflow:hidden} .bar i{display:block;height:14px;background:var(--blue)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.keys .btn{min-height:62px;font-size:26px}
.dots{display:flex;justify-content:center;gap:14px;padding:8px 0;min-height:40px}
.dots span{width:18px;height:18px;border-radius:999px;border:2px solid var(--blue)} .dots span.f{background:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chips .btn{min-height:44px;font-size:15px}
.ver{font-size:13px;color:var(--muted);text-align:center;padding:8px}
.cbtn{width:44px;height:44px;flex-shrink:0;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;padding:0}
.top .end{display:flex;align-items:center;gap:8px;min-width:0}
.top .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navi{-webkit-tap-highlight-color:transparent}

/* iPhone: keep the first bar clear of the notch when the app is installed */
body{padding-top:env(safe-area-inset-top)}
</style>

setInterval(function () { if (S.sess && document.visibilityState === 'visible') sync(); }, 30000);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.sess) sync(); });


function boot() {
  readLink();
  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
  if (!S.cfg) { S.scr = 'nolink'; return render(); }
  if (S.sess) { startSession(); hello(); return; }
  S.scr = 'signin'; render();
  hello().then(function (res) { if (res && res.empty) { S.scr = 'setup'; S.f = {}; } render(); });
}
boot();
</script>
