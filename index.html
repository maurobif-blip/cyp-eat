<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CYP EAT">
<title>CYP EAT</title>
<meta name="theme-color" content="#0B5FA5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --blue:#0B5FA5; --ink:#14213D; --muted:#4A5568; --ground:#F4F6FA; --card:#FFFFFF; --line:#D5DBE6; --edge:#7A869A;
  --em-bg:#FFE9D1; --em-ink:#6B2C00; --em:#B85300; --ok-bg:#DDF2DA; --ok-ink:#14600A; --wait-bg:#E4EBF7; --wait-ink:#1D3F7A;
  --warn-bg:#FFF4C2; --warn-ink:#5C4400; --off-bg:#ECECEC; --off-ink:#333333;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
h1{margin:0;font-size:24px} h2{margin:4px 0 0;font-size:18px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--ground)}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top);z-index:5}
.top .who{font-size:14px;font-weight:700;color:var(--muted);text-align:right;background:none;border:0;padding:4px 0;min-height:44px}
.net{font-size:14px;font-weight:700;padding:6px 16px;background:var(--warn-bg);color:var(--warn-ink)}
.net.ok{background:var(--wait-bg);color:var(--wait-ink)}
main{flex:1 1 auto;padding:16px calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{min-height:48px;padding:0 14px;border-radius:8px;border:2px solid var(--edge);background:var(--card);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;color:var(--ink)}
.btn.pri,.btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.big{min-height:56px;font-size:18px}
.btn.sq{width:48px;padding:0;font-size:24px;flex-shrink:0}
.btn.link{border:0;background:none;color:var(--blue);min-height:44px;padding:0 4px;justify-content:flex-start}
/* the arrow back to the page before stays under the top bar when the page is scrolled */
.btn.link.bk{position:sticky;top:calc(env(safe-area-inset-top) + var(--toph,65px));z-index:4;background:var(--ground);margin:0 -16px -6px;padding:6px 20px;min-height:52px;border-radius:0;border-bottom:1px solid var(--line);font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:grid;gap:6px}
.pill{padding:4px 10px;border-radius:999px;font-size:14px;font-weight:700;background:var(--wait-bg);color:var(--wait-ink);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn-ink)} .pill.off{background:var(--off-bg);color:var(--off-ink)} .pill.em{background:var(--em-bg);color:var(--em-ink)}
.in{width:100%;min-height:48px;padding:0 12px;border:2px solid var(--edge);border-radius:8px;background:#fff}
.in:disabled{background:var(--off-bg);border-color:var(--line)}
textarea.in{min-height:110px;padding:10px 12px}
.lab{font-weight:700}
.sec{font-size:14px;font-weight:700;color:var(--blue)}
.m{color:var(--muted)} .s{font-size:14px} .b{font-weight:700} .num{font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 0}
.row:first-child{border-top:0}
.nc{min-height:40px;padding:0 10px;border-radius:8px;border:2px solid var(--edge);background:#fff;font-size:14px;font-weight:700}
.nc.on{background:var(--em-bg);border-color:var(--em);color:var(--em-ink)}
.step{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:64px;width:100%;text-align:left}
.dot{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:13px}
.dot.ok{background:var(--ok-bg);color:var(--ok-ink)} .dot.em{background:var(--blue);color:#fff} .dot.off{background:var(--off-bg);color:var(--off-ink)}
.box{border-radius:8px;padding:12px;font-weight:700;border:2px solid}
.box.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-ink)}
.box.em{background:var(--em-bg);color:var(--em-ink);border-color:var(--em)}
.box.info{background:var(--wait-bg);color:var(--wait-ink);border-color:var(--blue)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.bottom .in2{display:flex;width:100%;max-width:560px}
.navi{flex:1 1 0;min-height:62px;border:0;border-top:4px solid #fff;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted)}
.navi.on{color:var(--blue);border-top-color:var(--blue)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tap{width:250px;height:250px;border-radius:999px;border:0;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 0 #08467A;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tap:active{transform:translateY(4px);box-shadow:0 2px 0 #08467A}
/* a count: not counted red, counting orange, finished green (always with the word next to the colour) */
:root{--bad-bg:#FBDCDA;--bad-ink:#8A1410;--bad:#B3261E;--cnt:#B85300}
.pill.bad{background:var(--bad-bg);color:var(--bad-ink)}
.tap.s-none{background:var(--bad);box-shadow:0 6px 0 #7A1712} .tap.s-count{background:var(--cnt);box-shadow:0 6px 0 #7A3700} .tap.s-done{background:var(--ok-ink);box-shadow:0 6px 0 #0B3D06}
.tap.s-none:active,.tap.s-count:active,.tap.s-done:active{box-shadow:0 2px 0 rgba(0,0,0,.45)}
.sd{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;border:2px solid #fff;flex-shrink:0} .sd.s-none{background:var(--bad)} .sd.s-count{background:var(--cnt)} .sd.s-done{background:var(--ok-ink)}
.tap{position:relative;-webkit-tap-highlight-color:transparent;outline:none}
.tap:focus-visible{box-shadow:0 6px 0 #08467A,0 0 0 5px var(--em)}
.tap::after{content:'';position:absolute;inset:0;border-radius:999px;pointer-events:none}
.tap.hit::after{animation:ring .4s ease-out}
@keyframes ring{from{box-shadow:0 0 0 0 rgba(11,95,165,.5)}to{box-shadow:0 0 0 26px rgba(11,95,165,0)}}
.adds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px} .adds .btn{min-height:56px;font-size:20px;border-radius:999px}
.fr{display:flex;gap:6px} .fr .btn{min-height:40px;flex:1 1 0;font-size:17px}
.daybar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px}
.daybar.today{border-color:var(--ok-ink)} .daybar.past{border-color:var(--em)}
.grid4{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;font-size:15px}
.grid4 span{padding:7px 0;border-top:1px solid var(--line)} .grid4 .h{font-size:13px;font-weight:700;color:var(--muted);border-top:0}
.grid4 .r{text-align:right}
.grid4.g5{grid-template-columns:1.3fr 1fr 1fr 1fr 1fr 1fr;font-size:14px}
main>.btn.link.bk:first-child{margin-top:-16px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px} .cal .h{text-align:center;font-size:13px;font-weight:700;color:var(--muted);padding:4px 0}
.cal .btn{min-height:50px;padding:0;font-size:17px;flex-direction:column;gap:1px} .cal .btn.tod{border:3px solid var(--ok-ink)} .cal .btn:disabled{opacity:.3} .cal .sd{margin:0;width:10px;height:10px;border-width:1px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px} .days .btn{min-height:44px;padding:0;font-size:14px}
.bar{height:14px;border-radius:4px;background:var(--wait-bg);overflow:hidden} .bar i{display:block;height:14px;background:var(--blue)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.keys .btn{min-height:62px;font-size:26px}
.dots{display:flex;justify-content:center;gap:14px;padding:8px 0;min-height:40px}
.dots span{width:18px;height:18px;border-radius:999px;border:2px solid var(--blue)} .dots span.f{background:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chips .btn{min-height:44px;font-size:15px}
.ver{font-size:13px;color:var(--muted);text-align:center;padding:8px}
.cbtn{width:44px;height:44px;flex-shrink:0;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;padding:0}
.top .end{display:flex;align-items:center;gap:8px;min-width:0}
.top .brand{display:flex;align-items:center;gap:8px;flex-shrink:0} .top .brand img{display:block;width:38px;height:36px}
.plogo{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0} .plogo img{width:77px;height:72px}
/* two short lines (centre and name, or the access and Sign out), so they fit next to the two logos on a phone */
.top .who{min-width:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.2} .top .who span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navi{-webkit-tap-highlight-color:transparent}

/* iPhone: keep the first bar clear of the notch when the app is installed */
body{padding-top:env(safe-area-inset-top)}
</style>
</head>

var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var DAYSCR = { people: 1, today: 1, menu: 1, before: 1, after: 1 };
function askDay(keep) { S.dayOk = false; S.pick = keep && S.date ? S.date : todayStr(); S.calM = S.pick.slice(0, 8) + '01'; }
function needDay() { return !!(S.sess && S.sess.mode === 'entry' && S.sess.centre && !S.dayOk && DAYSCR[S.scr]); }
function dayPickScreen() {
  var db = view(), t = todayStr(), c = S.sess.centre, pick = S.pick || t, m0 = S.calM || pick.slice(0, 8) + '01', meals = countMeals();
  var y = Number(m0.slice(0, 4)), mo = Number(m0.slice(5, 7)), n = new Date(Date.UTC(y, mo, 0)).getUTCDate(), off = (eatWeekday(m0) + 6) % 7, cells = '';
  for (var i = 0; i < off; i++) cells += '<span></span>';
  for (var d = 1; d <= n; d++) {
    var ds = m0.slice(0, 8) + (d < 10 ? '0' : '') + d, on = ds === pick, fut = ds > t, st = '';
    if (!fut) { var some = 0, done = 0; meals.forEach(function (m) { var p = eatGet(db, 'people', c, ds, m); if (p) { some++; if (p.data.done) done++; } }); st = some ? (done === meals.length ? 'done' : 'count') : ''; }
    cells += '<button class="btn' + (on ? ' on' : '') + (ds === t ? ' tod' : '') + '" data-a="calDay" data-d="' + ds + '" aria-pressed="' + on + '" aria-label="' + dayName(ds) + (ds === t ? ', today' : '') + (st ? ', ' + (st === 'done' ? 'all meals finished' : 'counting') : '') + '"' + (fut ? ' disabled' : '') + '>' + d + (st ? '<span class="sd s-' + st + '"></span>' : '') + '</button>';
  }
  var cur = m0 === t.slice(0, 8) + '01', isT = pick === t;
  return '<h1>Which day are you counting?</h1><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>Centre: <span class="b">' + esc(centreName(c)) + '</span></span><button class="btn" data-a="centreAsk" style="min-height:44px">Change the centre</button></div><span class="m">Look at the day, then confirm.</span>' +
    '<div class="card"><div style="display:flex;align-items:center;justify-content:space-between"><button class="btn sq" data-a="calMonth" data-d="-1" aria-label="Month before">' + ic('back') + '</button><span class="b" style="font-size:20px">' + MONTHS[mo - 1] + ' ' + y + '</span>' + (cur ? '<span style="width:48px"></span>' : '<button class="btn sq" data-a="calMonth" data-d="1" aria-label="Month after">' + ic('next') + '</button>') + '</div>' +
    '<div class="cal">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (h) { return '<span class="h">' + h + '</span>'; }).join('') + cells + '</div>' +
    '<span class="m s" style="display:flex;align-items:center;gap:4px;flex-wrap:wrap"><span class="sd s-count"></span>counting <span class="sd s-done" style="margin-left:10px"></span>all meals finished</span></div>' +
    '<div class="box ' + (isT ? 'ok' : 'em') + '" role="status" style="font-size:20px;text-align:center"><span class="b">' + dayName(pick) + '</span> · ' + (isT ? 'today' : (pick === eatAddDays(t, -1) ? 'yesterday, not today' : 'not today')) + '</div>' +
    '<button class="btn big" data-a="dayConfirm" style="min-height:72px;font-size:20px;background:var(--ok-ink);border-color:var(--ok-ink);color:#fff">' + ic('check') + 'Yes, count ' + dayName(pick) + ' · ' + esc(centreName(c)) + '</button>' +
    (isT ? '' : '<button class="btn" data-a="calToday">Back to today</button>');
}
function mealSeg() {
  var ms = countMeals();
  if (ms.length < 2) return ''; /* one meal to count: nothing to choose */
  return '<div class="seg" style="grid-template-columns:repeat(' + ms.length + ',minmax(0,1fr))">' + ms.map(function (m) { var st = m === S.meal ? curState() : savedState(eatGet(view(), 'people', S.sess.centre, S.date, m)); return '<button class="btn' + (m === S.meal ? ' on' : '') + '" data-a="meal" data-m="' + m + '" aria-pressed="' + (m === S.meal) + '" aria-label="' + m + ': ' + STLAB[st].toLowerCase() + '"><span class="sd s-' + st + '"></span>' + m + '</button>'; }).join('') + '</div>';
}

/* ---------- people: its own tab, one number for each meal ---------- */
function draftKey() { return 'people|' + S.sess.centre + '|' + S.date + '|' + S.meal; }
/* a centre that cooks for another group (Luigi for Holy Family) counts each group on its own */
function centreGroups() { var c = eatCentre(view(), S.sess.centre); return c && c.groups ? c.groups : []; }
function curCount() { return S.f.grp ? (S.f.g[S.f.grp] || 0) : S.f.n; }
function setCount(v) { if (S.f.grp) S.f.g[S.f.grp] = v; else S.f.n = v; }
function pData() { var d = { n: S.f.n }, gs = centreGroups(); if (gs.length) { d.g = {}; gs.forEach(function (k) { d.g[k] = S.f.g[k] || 0; }); } if (S.f.done) d.done = true; return d; }
function samePeople(e, d) { if (!e) return false; if (e.data.n !== d.n || !!e.data.done !== !!d.done) return false; var a = e.data.g || {}, b = d.g || {}; for (var k in b) if ((a[k] || 0) !== b[k]) return false; return true; }
function peopleLine(d) {
  var gs = centreGroups(); if (!gs.length) return plural(d.n, 'plate', 'plates');
  return esc(centreName(S.sess.centre)) + ' ' + d.n + gs.map(function (k) { return ' · ' + esc(k) + ' ' + ((d.g || {})[k] || 0); }).join('') + ' = ' + plural(eatPlates({ data: d }), 'plate', 'plates');
}
/* the state of a count: none (not counted), count (counting), done (finished) */
var STLAB = { none: 'Not counted', count: 'Counting', done: 'Finished' }, STPILL = { none: 'bad', count: 'em', done: 'ok' };
function savedState(p) { return !p ? 'none' : (p.data.done ? 'done' : 'count'); }
function curState() { var saved = eatGet(view(), 'people', S.sess.centre, S.date, S.meal); return S.f.done ? 'done' : (saved || S.pPend || eatPlates({ data: pData() }) ? 'count' : 'none'); }
function peopleStatus() {
  var saved = eatGet(view(), 'people', S.sess.centre, S.date, S.meal), d = pData(), st = curState();
  if (st === 'none') return '<span class="pill bad">Not counted</span>';
  return '<span class="pill ' + STPILL[st] + '">' + STLAB[st] + ': ' + peopleLine(d) + (S.pPend || !samePeople(saved, d) ? ' · saving…' : ' · saved') + '</span>';
}
SCREENS.people = function () {
  var db = view(), c = S.sess.centre, n = curCount(), gs = centreGroups(), st = curState();
  var all = countMeals().map(function (m) { var p = eatGet(db, 'people', c, S.date, m), ms = m === S.meal ? st : savedState(p), pl = m === S.meal ? eatPlates({ data: pData() }) : (p ? eatPlates(p) : 0); return '<div class="row"><span class="b">' + m + '</span><span class="pill ' + STPILL[ms] + '">' + STLAB[ms] + (ms === 'none' ? '' : ': ' + plural(pl, 'plate', 'plates')) + '</span></div>'; }).join('');
  var grp = gs.length ? '<div class="seg" role="group" aria-label="Who eats" style="grid-template-columns:repeat(' + (gs.length + 1) + ',minmax(0,1fr))">' + [''].concat(gs).map(function (k) { var on = (S.f.grp || '') === k; return '<button class="btn' + (on ? ' on' : '') + '" data-a="grp" data-g="' + esc(k) + '" aria-pressed="' + on + '">' + esc(k || centreName(c)) + ' <span class="num">' + (k ? (S.f.g[k] || 0) : S.f.n) + '</span></button>'; }).join('') + '</div>' : '';
  return dayBar() + mealSeg() + grp +
    '<div style="display:flex;justify-content:center;padding:18px 0 6px"><button class="tap s-' + st + '" data-a="tap" aria-label="Add one plate' + (S.f.grp ? ' for ' + esc(S.f.grp) : '') + '"><span class="num" style="font-size:88px;font-weight:800;line-height:1" id="cnt">' + n + '</span><span style="font-size:20px;font-weight:700">' + (S.f.grp ? esc(S.f.grp) + ': +1' : 'Tap: +1') + '</span></button></div>' +
    (countMeals().length < 2 ? '<div class="b" style="text-align:center;font-size:18px">' + S.meal + ' · ' + esc(centreName(c)) + '</div>' : '') +
    '<div style="text-align:center" id="pst" aria-live="polite">' + peopleStatus() + '</div>' +
    '<div class="adds"><button class="btn" data-a="add" data-n="5">+5</button><button class="btn" data-a="add" data-n="10">+10</button><button class="btn" data-a="adding">Other</button></div>' +
    (S.f.adding ? '<div class="card"><label class="lab" for="an">How many more plates? (counted by hand)</label><input id="an" class="in num" type="number" inputmode="numeric" min="1" data-f="an" data-focus><button class="btn pri" data-a="addOk">Add</button></div>' : '') +
    '<button class="btn" data-a="undo">Undo the last one</button>' +
    (st === 'done' ? '<div class="box ok" role="status">' + S.meal + ' is finished: ' + peopleLine(pData()) + '. A new tap opens the count again.</div>' + (eatLeft(db, c) ? '<button class="btn pri big" data-a="go" data-to="after">Next: leftovers</button>' : '')
      : '<button class="btn big" data-a="finish" style="background:var(--ok-ink);border-color:var(--ok-ink);color:#fff">' + ic('check') + 'Finish ' + S.meal.toLowerCase() + '</button>') +
    (S.f.typing ? '<div class="card"><label class="lab" for="tn">Number of plates in all' + (S.f.grp ? ' for ' + esc(S.f.grp) : '') + '</label><input id="tn" class="in num" type="number" inputmode="numeric" min="0" value="' + n + '" data-f="tn" data-focus><button class="btn" data-a="typeOk">OK</button></div>' : '<button class="btn link" data-a="typing">Type the number in all</button>') +
    '<span class="m s" style="text-align:center">Every change is saved by itself. Press Finish when the meal is over.</span>' +
    '<div class="card" style="gap:0"><span class="b" style="font-size:18px;padding-bottom:6px">All meals, ' + dayName(S.date) + '</span>' + all +
      fixedMeals().map(function (m) { return '<div class="row"><span class="b">' + m + '</span><span class="pill">' + eatFixed(db, c, m) + ' plates every day · not counted</span></div>'; }).join('') + '</div>';
};

/* ---------- daily: the food of the whole day ---------- */
function stepBtn(n, title, sub, to, cls) {
  return '<button class="step" data-a="go" data-to="' + to + '"><span class="dot ' + cls + '">' + (cls === 'ok' ? ic('check') : n) + '</span><span style="flex:1 1 auto;display:flex;flex-direction:column"><span class="b">' + title + '</span><span class="m s">' + sub + '</span></span>' + ic('next') + '</button>';
}
/* one meal of a menu in words */
function menuText(db, mn, meal) {
  var p = [];
  if (meal === 'Breakfast') { if (mn.mm) p.push('Porridge'); if (mn.other) p.push(mn.other); if (mn.bread) p.push('Bread'); }
  else if (mn.mm) p.push('Nshima');
  (mn.relish || []).forEach(function (r) { var it = eatItem(db, r); if (it) p.push(it.name.toLowerCase()); });
  if (mn.veg) p.push(mn.veg.toLowerCase());
  return p.join(', ').replace(/^./, function (x) { return x.toUpperCase(); });
}
/* dinner is the same food as lunch (comment of 20/11): one card on the menu page, one line in the texts */
function sameDinner(meals) { return !!(meals.Lunch && meals.Dinner); }
function dayMenuText(db, dm) {
  var p = [], one = sameDinner(dm.meals) && menuText(db, dm.meals.Lunch, 'Lunch') === menuText(db, dm.meals.Dinner, 'Dinner');
  for (var m in dm.meals) { if (one && m === 'Dinner') continue; p.push((one && m === 'Lunch' ? 'Lunch and dinner' : m) + ': ' + (menuText(db, dm.meals[m], m) || '–')); }
  return p.join(' · ');
}
function qtyLine(db, q, unitOf) {
  var parts = []; for (var id in q) { if (q[id] == null) continue; var it = eatItem(db, id); if (id === 'pcs') parts.push(q[id] + ' pieces'); else if (it) parts.push(it.name + ' ' + fmt(q[id]) + ' ' + (unitOf && unitOf[id] === 'unit' ? it.unit : it.use)); }
  return parts.join(' · ');
}
function perTxt(it, per) { return per == null ? '–' : (it.use === 'kg' ? Math.round(per * 1000) + ' g a plate' : fmt(per) + ' ' + it.use + ' a plate'); }
SCREENS.today = function () {
  var db = view(), c = S.sess.centre, d = S.date, dm = eatDayMenu(db, c, d), left = eatLeft(db, c);
  var b = eatGet(db, 'dbefore', c, d, ''), a = eatGet(db, 'dafter', c, d, ''), sk = eatGet(db, 'dskip', c, d, '');
  var out = dayBar() + '<span class="m b">' + esc(centreName(c)) + '</span>';
  /* the work of the day starts here: 1 and 2 first, then the count of the people */
  var ready = (sk && sk.data.on) || (dm.saved && b), going = countMeals().some(function (m) { return eatGet(db, 'people', c, d, m); });
  var startBtn = '<button class="btn big' + (ready ? ' pri' : '') + '" data-a="go" data-to="people" style="min-height:64px;font-size:20px">' + ic('people') + (going ? 'Go on counting the people' : 'Start counting the people') + '</button>' +
    (ready ? '' : '<span class="m s" style="text-align:center">First answer 1 and 2, then start counting.</span>');
  if (sk && sk.data.on) out += '<div class="box em">Food not counted on ' + dayName(d) + '. People are counted.</div><button class="btn" data-a="skip" data-on="0">Undo</button>' + startBtn;
  else out += '<div style="display:flex;flex-direction:column;gap:8px">' +
    stepBtn('1', 'What do we eat today?', esc(dayMenuText(db, dm)) + (dm.saved ? '' : ' (plan)') + (dm.cook ? ' · Cook: ' + esc(dm.cook) : ''), 'menu', dm.saved ? 'ok' : 'em') +
    stepBtn('2', 'Quantities for today', b ? esc(qtyLine(db, b.data.q, b.data.u)) : 'Food taken out of the store and the cold room for the meals of today', 'before', b ? 'ok' : (dm.saved ? 'em' : 'off')) +
    startBtn +
    (left ? stepBtn('3', 'Leftovers', a ? 'Saved' : 'After the count: what is left at the end of the day', 'after', a ? 'ok' : (b ? 'em' : 'off')) : '') +
    '</div><button class="btn" data-a="skip" data-on="1">I didn\'t count the food</button>';
  /* the day: plates and the amount a plate */
  var u = eatDayUse(db, c, d), rows = '';
  if (u.closed && u.base) db.items.forEach(function (it) { if (u.used[it.id] == null) return; rows += '<div class="row"><span class="b">' + esc(it.name) + '</span><span class="num">' + perTxt(it, eatPerPlate(u, it.id)) + '</span></div>'; });
  out += '<div class="card" style="gap:0"><span class="b" style="font-size:18px;padding-bottom:6px">' + dayName(d) + '</span>' +
    '<div class="row"><span>Plates</span><span class="b num">' + (u.plates == null ? '<span class="pill warn">People: to do</span>' : u.plates + (u.peopleMissing ? ' <span class="m s">(' + plural(u.peopleMissing, 'meal', 'meals') + ' not counted)</span>' : '')) + '</span></div>' + rows +
    (!rows && !u.skipped ? '<span class="m s" style="padding-top:6px">' + (u.hasBefore ? (u.closed ? 'Count the people to see the amount a plate.' : 'After the leftovers: the amount a plate.') : 'After the quantities for today: the amount a plate.') + '</span>' : '') + '</div>';
  return out;
};
function notesOfWeek(db, c, d) { var mon = eatMonday(d); return eatNotes(db, mon, eatAddDays(mon, 6), c); }
/* one quantity row: id, label, unit, value, not counted */
function qRow(key, label, unit, val, nc, step, tog) {
  return '<div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><label for="q_' + key + '" class="lab">' + esc(label) + '</label>' +
    (nc === undefined ? '' : '<button class="nc' + (nc ? ' on' : '') + '" data-a="nc" data-k="' + key + '" aria-pressed="' + !!nc + '">Not counted</button>') + '</div>' +
    '<div style="display:flex;align-items:center;gap:8px"><button class="btn sq" data-a="step" data-k="' + key + '" data-s="-' + step + '" aria-label="Less"' + (nc ? ' disabled' : '') + '>−</button>' +
    '<input id="q_' + key + '" class="in num" type="text" inputmode="decimal" autocomplete="off" value="' + (nc || val == null ? '' : esc(String(val))) + '" data-q="' + key + '"' + (nc ? ' disabled' : '') + ' style="text-align:right;font-size:20px;font-weight:700">' +
    '<span class="m b" style="width:84px;flex-shrink:0;white-space:nowrap">' + esc(unit) + '</span>' +
    '<button class="btn sq" data-a="step" data-k="' + key + '" data-s="' + step + '" aria-label="More"' + (nc ? ' disabled' : '') + '>+</button></div>' +
    (key === 'pcs' || nc ? '' : '<div class="fr">' + [[0, '0'], [0.25, '¼'], [0.5, '½'], [0.75, '¾']].map(function (x) { return '<button class="btn" data-a="frac" data-k="' + key + '" data-v="' + x[0] + '" aria-label="' + (x[0] ? 'And ' + x[1] : 'Whole number') + '">' + (x[0] ? '+' + x[1] : '.0') + '</button>'; }).join('') + '</div>') + (tog || '') + '</div>';
}
/* halves and quarters for what is weighed or comes in bags and trays; whole numbers for chickens, eggs, loaves */
function stepOf(unit) { return unit === 'kg' || unit === 'bags' || unit === 'trays' ? 0.25 : 1; }
function rowUnit(it, u) { return it.unit !== it.use && u === 'unit' ? 'unit' : 'use'; }
function unitTog(it, u) {
  if (it.unit === it.use) return '';
  var cur = rowUnit(it, u);
  return '<div class="seg" role="group" aria-label="Unit for ' + esc(it.name) + '" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
    ['unit', 'use'].map(function (x) { return '<button class="btn s' + (x === cur ? ' on' : '') + '" data-a="unit" data-k="' + it.id + '" data-v="' + x + '" aria-pressed="' + (x === cur) + '">In ' + esc(x === 'unit' ? it.unit : it.use) + '</button>'; }).join('') + '</div>';
}
function backLink() { return '<button class="btn link bk" data-a="go" data-to="today">' + ic('back') + 'Daily</button>'; }
function weekLink() { return '<button class="btn link bk" data-a="go" data-to="week">' + ic('back') + 'Weekly</button>'; }
function dayTitle() { return '<div class="sec">' + dayName(S.date) + ' · ' + esc(centreName(S.sess.centre)) + '</div>'; }
SCREENS.menu = function () {
  var db = view(), f = S.f, relish = db.items.filter(function (it) { return it.relish; }), plan = eatItem(db, EAT_PLAN[eatWeekday(S.date)]);
  var cooks = (db.names || []).filter(function (n) { return n.active && n.role === 'Canteen'; }).map(function (n) { return n.name; }).sort();
  var cookCard = '<div class="card"><span class="b" style="font-size:18px">Cook</span>' +
    (cooks.length ? '<div class="chips">' + cooks.map(function (n) { var on = f.cook === n; return '<button class="btn' + (on ? ' on' : '') + '" data-a="cook" data-n="' + esc(n) + '" aria-pressed="' + on + '">' + esc(n) + '</button>'; }).join('') + '</div>' : '') +
    '<label for="ck" class="lab">' + (cooks.length ? 'Or write the name' : 'Name of the cook') + '</label><input id="ck" class="in" type="text" data-f="cook" value="' + esc(f.cook || '') + '"></div>';
  var both = sameDinner(f.meals);
  return backLink() + '<h1>What do we eat today?</h1>' + dayTitle() + cookCard + centreMeals().map(function (m) {
    var x = f.meals[m];
    if (both && m === 'Dinner') return '';
    if (m === 'Breakfast') return '<div class="card"><span class="b" style="font-size:18px">Breakfast</span><div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
      '<button class="btn' + (x.mm ? ' on' : '') + '" data-a="bfm" data-v="mm" aria-pressed="' + !!x.mm + '">Porridge</button>' +
      '<button class="btn' + (x.isOther ? ' on' : '') + '" data-a="bfm" data-v="other" aria-pressed="' + !!x.isOther + '">Other</button></div>' +
      (x.isOther ? '<label for="bfo" class="lab">What is it?</label><input id="bfo" class="in" type="text" data-mv="Breakfast" data-k="other" value="' + esc(x.other) + '" placeholder="Bread, tea…">' : '') + '</div>';
    return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="b" style="font-size:18px">' + (both && m === 'Lunch' ? 'Lunch and dinner' : m) + '</span>' + (plan ? '<span class="pill">' + WD[eatWeekday(S.date)] + ' plan: ' + esc(plan.name.toLowerCase()) + '</span>' : '') + '</div>' +
      '<button class="btn' + (x.mm ? ' on' : '') + '" data-a="mmm" data-m="' + m + '" aria-pressed="' + !!x.mm + '">Nshima</button>' +
      '<span class="lab">Relish</span><div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))">' + relish.map(function (it) { var on = x.relish.indexOf(it.id) >= 0; return '<button class="btn' + (on ? ' on' : '') + '" data-a="rel" data-m="' + m + '" data-id="' + it.id + '" aria-pressed="' + on + '">' + esc(it.name) + '</button>'; }).join('') + '</div>' +
      '<label for="veg_' + m + '" class="lab">Vegetable</label><input id="veg_' + m + '" class="in" type="text" data-mv="' + m + '" data-k="veg" value="' + esc(x.veg) + '"></div>';
  }).join('') + '<button class="btn pri big" data-a="saveMenu">Next: quantities for today</button>';
};
function foodRowsHtml(f, after) {
  var db = view(), out = '';
  f.rows.forEach(function (id) {
    var it = eatItem(db, id); if (!it) return;
    var un = rowUnit(it, f.u[id]), ut = un === 'unit' ? it.unit : it.use;
    out += qRow(id, (id === 'veg' && f.vegName ? f.vegName : it.name), ut, f.q[id], !!f.nc[id], stepOf(ut), after ? '' : unitTog(it, f.u[id]));
    if (id === 'chk') out += qRow('pcs', after ? 'Chicken pieces left' : 'Chicken pieces cut', 'pieces', f.q.pcs, !!f.nc.pcs, 1);
  });
  return out;
}
SCREENS.before = function () {
  var db = view(), f = S.f, more = db.items.filter(function (it) { return f.rows.indexOf(it.id) < 0; });
